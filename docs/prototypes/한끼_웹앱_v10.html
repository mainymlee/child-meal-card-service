<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>한끼 — 오늘 뭐 먹지?</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/toss/tossface/dist/tossface.css">
<style>
/* ── 한끼 네오브루탈 ─────────────────────────────
   스크린샷 기준: 진한 배경 + 파스텔 카드 + 두꺼운 잉크 테두리 + 오프셋 그림자
   서체: Pretendard + Tossface (오픈소스) */
:root{
  --bg:#F2F4F6; --bg2:#E8EAEE;
  --ink:#17151C; --paper:#FFFFFF;
  --tx:#17151C; --tx2:#5E5868; --tx3:#8D8798;
  --yellow:#F7D354; --blue:#C7DDF5; --purple:#DCD3F7; --pink:#F7CFDC; --khaki:#F7CFDC;
  --cream:#FBF7EE;
  --orange:#E8613C; --orange-soft:#FBE3DA;
  --bd:2.5px solid var(--ink);
  --shadow:4px 4px 0 var(--ink);
  --shadow-sm:3px 3px 0 var(--ink);
  --r:22px; --r-sm:15px;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:#E2E5E9;color:var(--tx);
  font-family:Pretendard,Tossface,-apple-system,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  line-height:1.5;word-break:keep-all;-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;
}
.tossface{font-family:Tossface,Pretendard,sans-serif}
#app{
  width:100%;max-width:430px;min-height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;position:relative;overflow:hidden;
}
@media(min-width:431px){ #app{box-shadow:0 0 0 1px var(--ink),0 24px 70px rgba(23,21,28,.18)} }

/* ── chrome ── */
.navbar{
  position:sticky;top:0;z-index:30;flex:none;display:flex;align-items:center;gap:6px;
  min-height:58px;padding:12px 18px 10px 14px;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.applogo{width:34px;height:auto;flex:none;margin-right:2px;transform:translateY(1px)}
.navbar h1{
  font-size:20px;font-weight:900;margin:0;letter-spacing:-.02em;flex:1;color:var(--tx);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.navbar .clock{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:13.5px;font-weight:700;color:var(--tx2);
  font-variant-numeric:tabular-nums;pointer-events:none;
}
.navbar .act{font-size:14px;font-weight:700;color:var(--tx2);background:none;border:0;padding:8px 2px;cursor:pointer;font-family:inherit}
.iconbtn{
  width:40px;height:40px;flex:none;border:0;background:none;color:var(--tx);
  display:grid;place-items:center;border-radius:12px;cursor:pointer;
}
.iconbtn:active{background:var(--bg2)}
.iconbtn svg{width:22px;height:22px}
.navbar:not(:has(.iconbtn)){padding-left:18px}
main{flex:1;overflow-y:auto;padding:8px 18px 26px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
main.chatmain{display:flex;flex-direction:column;padding-bottom:8px}

.tabbar{
  flex:none;position:sticky;bottom:0;z-index:30;display:flex;
  background:#F2F4F6;border-top:2.5px solid var(--ink);
  padding:5px 6px calc(7px + env(safe-area-inset-bottom));
}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:0;padding:8px 0 6px;color:#A6A0B0;cursor:pointer;
  font-size:11px;font-weight:750;font-family:inherit;border-radius:12px;min-height:52px;
}
.tabbar button svg{width:23px;height:23px}
.tabbar button.on{color:var(--ink)}
.tabbar button:active{background:var(--bg2)}
.footbar{
  flex:none;position:sticky;bottom:0;z-index:30;
  padding:10px 18px calc(14px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(12px);border-top:2.5px solid var(--ink);
}

/* ── 홈: 잔액 블록 + 타일 ── */
.block{
  background:var(--yellow);color:var(--ink);border:var(--bd);border-radius:26px;
  padding:22px 20px 18px;margin:8px 0 16px;box-shadow:var(--shadow);
}
.blabel{font-size:13.5px;font-weight:800;margin:0 0 4px;color:var(--ink);opacity:.75}
.block .amount{font-size:44px;font-weight:900;letter-spacing:-.03em;margin:0 0 12px;font-variant-numeric:tabular-nums;color:var(--ink)}
.block .amount span{font-size:23px;font-weight:800;margin-left:2px}
.block .meter .track{display:flex;height:14px;border-radius:99px;overflow:hidden;background:#fff;border:2px solid var(--ink)}
.block .meter .fill{background:var(--orange);border-radius:99px 0 0 99px}
.bdays{font-size:14.5px;font-weight:600;margin:10px 0 12px;color:var(--ink)}
.bdays b{font-weight:900}
.innerbox{
  display:flex;gap:9px;align-items:flex-start;background:#fff;border:2px solid var(--ink);
  border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;line-height:1.5;color:var(--ink);
}
.innerbox svg{width:17px;height:17px;flex:none;margin-top:2px}
.innerbox b{font-weight:900}
.innerbox.warn{background:var(--orange-soft)}
.block .linkline{color:var(--ink);opacity:.6;font-weight:700;padding-top:11px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.tile{
  display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;
  font-family:inherit;cursor:pointer;border:var(--bd);border-radius:24px;
  padding:18px 16px 16px;min-height:132px;box-shadow:var(--shadow);color:var(--ink);
  transition:transform .07s, box-shadow .07s;
}
.tile:active,.block:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.block:active{transform:none;box-shadow:var(--shadow)}
.tile.t-y{background:var(--yellow)}
.tile.t-b{background:var(--blue)}
.tile.t-p{background:var(--purple)}
.tile.t-k{background:var(--pink)}
.sticker{font-size:34px;line-height:1;margin-bottom:10px}
.tile .tt{font-size:16.5px;font-weight:850;letter-spacing:-.01em}
.tile .ts{font-size:12.5px;font-weight:600;opacity:.65}
.favrow{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;font-family:inherit;cursor:pointer;
  background:var(--cream);color:var(--ink);border:var(--bd);border-radius:20px;
  padding:14px 16px;box-shadow:var(--shadow-sm);min-height:64px;
}
.favrow:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.favrow .sticker{font-size:26px;margin:0}
.favrow>span:nth-child(2){flex:1;min-width:0;display:flex;flex-direction:column}
.favrow .tt{font-size:14.5px;font-weight:800}
.favrow .ts{font-size:12.5px;font-weight:600;opacity:.6}
.favrow .ch svg{width:17px;height:17px}

/* ── 공통 카드/버튼 (밝은 화면 요소는 종이 카드로) ── */
.card{background:var(--paper);color:var(--ink);border:var(--bd);border-radius:var(--r);padding:18px;margin-bottom:13px;box-shadow:var(--shadow-sm)}
main:not([data-screen="me"]) .card:nth-of-type(4n+1){background:var(--yellow)}
main:not([data-screen="me"]) .card:nth-of-type(4n+2){background:var(--blue)}
main:not([data-screen="me"]) .card:nth-of-type(4n+3){background:var(--purple)}
main:not([data-screen="me"]) .card:nth-of-type(4n+4){background:var(--pink)}
.card.flat{background:var(--cream)!important;box-shadow:none}
.card .sub{color:#4A4552}.card .lbl{color:#4A4552;opacity:.75}
.lbl{font-size:12.5px;font-weight:800;color:var(--tx3);margin:0 0 8px}
.sub{font-size:13.5px;color:var(--tx2);margin:0}

.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  min-height:52px;border:var(--bd);border-radius:16px;cursor:pointer;font-family:inherit;
  background:var(--yellow);color:var(--ink);font-size:15.5px;font-weight:850;
  box-shadow:var(--shadow-sm);transition:transform .07s, box-shadow .07s;
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn.sm{min-height:44px;font-size:14px;border-radius:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.editbtn{
  background:none;border:0;font-family:inherit;cursor:pointer;
  font-size:13px;font-weight:800;color:var(--orange);padding:2px;float:right;text-decoration:underline;text-underline-offset:3px;
}
.linkline{
  display:block;width:100%;text-align:left;background:none;border:0;font-family:inherit;cursor:pointer;
  font-size:13px;font-weight:700;color:var(--tx3);padding:12px 0 0;min-height:38px;
}

/* pill: 카드 안 상태 텍스트 / 어두운 배경 위 칩 */
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:750;
  padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--cream);color:var(--ink);border:1.5px solid var(--ink);
}
.pill .d{width:6px;height:6px;border-radius:50%;background:var(--orange)}
.pill.pri{background:var(--blue)}
.pill.warn{background:var(--yellow)}
.pill.bad{background:var(--pink)}
.pill.ok{background:var(--cream)}
.badges{display:flex;align-items:center;flex-wrap:wrap;gap:0 6px}
.badges .pill{background:none;border:0;padding:0;border-radius:0;font-size:12px;color:#4A4552;font-weight:600;opacity:.85}
.badges .pill.ok{color:inherit;font-weight:800}
.badges .pill+.pill::before{content:"·";margin-right:6px;opacity:.4}
.alert{
  display:flex;gap:9px;align-items:flex-start;font-size:13.5px;line-height:1.55;
  border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin-top:13px;font-weight:600;color:var(--ink);
}
.alert svg{width:17px;height:17px;flex:none;margin-top:2px}
.alert.warn{background:var(--orange-soft)}
.alert.good{background:var(--cream)}
.alert b{font-weight:900}

/* ── 검색바 ── */
.searchbar{
  display:flex;align-items:center;gap:8px;background:var(--paper);border:var(--bd);
  border-radius:15px;padding:0 13px;margin:4px 0 12px;min-height:46px;color:var(--ink);
  box-shadow:var(--shadow-sm);
}
.searchbar svg{width:17px;height:17px;color:#847F90;flex:none}
.searchbar input{
  flex:1;border:0;background:none;font-family:inherit;font-size:14.5px;color:var(--ink);
  outline:none;min-height:44px;font-weight:600;
}
.searchbar input::placeholder{color:#9A94A6;font-weight:500}
.searchbar .clear{
  border:1.5px solid var(--ink);background:var(--yellow);color:var(--ink);width:20px;height:20px;border-radius:50%;
  display:grid;place-items:center;font-size:12px;font-weight:900;cursor:pointer;flex:none;line-height:1;padding:0;
}
.store.hiddenq{display:none}

/* ── 지도/결과 ── */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 11px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;font-size:13px;font-weight:750;font-family:inherit;cursor:pointer;
  padding:8px 13px;border-radius:999px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);min-height:38px;
}
.chip.on{background:var(--ink);color:var(--yellow);border-color:#000}
.catbar{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 11px;margin:0 -2px;scrollbar-width:none}
.catbar::-webkit-scrollbar{display:none}
.catchip{
  flex:none;display:inline-flex;align-items:center;gap:5px;font-family:inherit;cursor:pointer;
  font-size:13.5px;font-weight:800;color:var(--ink);background:var(--paper);border:2px solid var(--ink);border-radius:999px;
  padding:8px 13px;min-height:39px;
}
.catchip .cnt{font-size:11px;font-weight:800;opacity:.5}
.catchip.on{background:var(--paper);box-shadow:2px 2px 0 var(--ink)}
.catchip[data-cat="kr"].on{background:var(--yellow)}
.catchip[data-cat="cn"].on{background:var(--blue)}
.catchip[data-cat="wf"].on{background:var(--purple)}
.catchip[data-cat="bs"].on{background:var(--pink)}
.catchip[data-cat="cvs"].on{background:#EFEDE6}
.catchip[data-cat="all"].on{background:var(--ink);color:#fff}
.catchip[data-cat="all"].on .cnt{color:rgba(255,255,255,.6);opacity:1}
.mapwrap{position:relative;border-radius:var(--r);overflow:hidden;border:var(--bd);margin-bottom:13px;height:214px;box-shadow:var(--shadow-sm)}
.mapwrap.round{height:214px}
.mapwrap.big{height:342px}
.mapbox{position:absolute;inset:0;background:#EFEAF6}
.mapbox svg{display:block;width:100%;height:100%}
.maptip{
  position:absolute;left:10px;top:10px;z-index:5;background:var(--paper);
  border:2px solid var(--ink);border-radius:999px;padding:5px 11px;
  font-size:12px;font-weight:800;color:var(--ink);
}
.mapctl{position:absolute;right:10px;top:10px;z-index:5;display:flex;flex-direction:column;gap:6px}
.mapctl button{
  width:35px;height:35px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);
  color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:2px 2px 0 var(--ink);
}
.mapctl button:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.mapctl button svg{width:16px;height:16px}
.kme{width:15px;height:15px;border-radius:50%;background:var(--orange);border:2.5px solid var(--ink);box-shadow:2px 2px 0 rgba(0,0,0,.3)}
.kpin{position:relative;cursor:pointer}
.kpin .b{
  background:var(--paper);color:var(--ink);border:2px solid var(--ink);
  font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:999px;white-space:nowrap;
  box-shadow:2px 2px 0 var(--ink);font-family:Pretendard,sans-serif;display:flex;align-items:center;gap:4px;
}
.kpin .b .tossface{font-size:13px}
.kpin.cat-kr .b{background:var(--yellow)}
.kpin.cat-cn .b{background:var(--blue)}
.kpin.cat-wf .b{background:var(--purple)}
.kpin.cat-bs .b{background:var(--pink)}
.kpin.cat-cvs .b{background:#EFEDE6}
.kpin.dim .b{opacity:.55;border-style:dashed;box-shadow:none}
.kpin .tail{width:7px;height:7px;background:var(--paper);border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);margin:-4px auto 0}
.kclu{
  width:36px;height:36px;border-radius:50%;background:var(--yellow);color:var(--ink);
  display:grid;place-items:center;font-size:13.5px;font-weight:900;
  border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer;font-family:Pretendard,sans-serif;
}
.listhead{display:flex;justify-content:space-between;align-items:baseline;margin:6px 2px 10px}
.listhead p{margin:0;font-size:13.5px;font-weight:850;color:var(--tx)}
.listhead p b{color:var(--orange)}
.listhead span{font-size:12px;color:var(--tx3)}
.store{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font-family:inherit;
  background:var(--paper);color:var(--ink);border:var(--bd);border-radius:20px;
  padding:13px 14px;margin-bottom:11px;box-shadow:var(--shadow-sm);transition:transform .07s, box-shadow .07s;
}
.store:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.store.cat-kr{background:var(--yellow)}
.store.cat-cn{background:var(--blue)}
.store.cat-wf{background:var(--purple)}
.store.cat-bs{background:var(--pink)}
.store.cat-cvs{background:#EFEDE6}
.card .store,.sheet .store{background:var(--paper)!important;box-shadow:none;border-width:2px}
.store .no{
  width:44px;height:44px;flex:none;border-radius:14px;border:2px solid var(--ink);background:#fff;
  font-size:21px;display:grid;place-items:center;align-self:center;
}
.store.demoted{opacity:.72}
.store.demoted .no{background:var(--cream);border-style:dashed}
.store .nm{font-size:14.5px;font-weight:800;margin:0 0 1px;color:var(--ink)}
.store .mt{font-size:12.5px;color:#4A4552;margin:0 0 6px;font-weight:550}
.store>div:nth-child(2){flex:1;min-width:0}
.store .dist{flex:none;text-align:right;font-size:11.5px;color:#5E5868;align-self:center;font-weight:600}
.store .dist b{display:block;font-size:13.5px;font-weight:850;color:var(--ink);margin-bottom:1px}
.badges .pill{color:#4A4552;opacity:.8}
.badges .pill.ok{color:var(--ink)}
.cvsbanner{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;font-family:inherit;
  background:#EFEDE6;color:var(--ink);border:var(--bd);border-radius:18px;
  padding:13px 15px;margin-bottom:12px;box-shadow:var(--shadow-sm);
}
.cvsbanner:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.cvsbanner .ic{font-family:Tossface;font-size:25px;flex:none}
.cvsbanner .t{font-size:14px;font-weight:850;margin:0}
.cvsbanner .s{font-size:12.5px;font-weight:600;opacity:.65;margin:1px 0 0}
.cvsbanner>div{flex:1;min-width:0}
.cvsbanner .ch svg{width:16px;height:16px}
.empty{text-align:center;padding:36px 22px;background:var(--blue);color:var(--ink);border:var(--bd);border-radius:var(--r);margin-bottom:12px;box-shadow:var(--shadow-sm)}
.empty .big{font-size:46px;margin-bottom:10px;font-family:Tossface}
.empty h3{font-size:16.5px;font-weight:850;margin:0 0 6px}
.empty p{font-size:13.5px;color:#4A4552;margin:0 0 16px;font-weight:550}

/* ── 상세 ── */
.hero{
  height:168px;border-radius:var(--r);background:var(--pink);border:var(--bd);box-shadow:var(--shadow-sm);
  display:grid;place-items:center;margin:6px 0 14px;font-family:Tossface;font-size:56px;
}
.kv{display:grid;grid-template-columns:72px 1fr;gap:9px 14px;font-size:13.5px;margin:15px 0 0;color:var(--tx)}
.kv dt{color:#8D8798;font-weight:600}
.kv dd{margin:0;font-weight:650}
.menu{list-style:none;margin:0;padding:0}
.menu li{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1.5px dashed rgba(23,21,28,.22);font-size:14px;font-weight:600;min-height:44px}
.menu li:last-child{border-bottom:0}
.menu .p{font-variant-numeric:tabular-nums;font-weight:850}
.menu .p.ok{color:var(--orange)}
.menu .p.over{opacity:.4;font-weight:600}
.report{
  display:block;width:100%;background:none;border:0;cursor:pointer;font-family:inherit;
  color:var(--tx3);font-size:13px;font-weight:650;padding:11px 0 2px;min-height:42px;
  text-decoration:underline;text-underline-offset:3px;
}

/* ── 챗봇 ── */
.botrow{display:flex;gap:9px;align-items:flex-start;max-width:88%}
.botava{
  width:36px;height:36px;flex:none;border-radius:50%;
  background:var(--yellow);border:2px solid var(--ink);
  object-fit:contain;padding:4px;box-shadow:2px 2px 0 var(--ink);
}
.botname{font-size:11.5px;font-weight:800;color:var(--tx2);margin:0 0 4px 4px}
.botrow .msg.bot{max-width:100%}
.quick,.reccard{margin-left:45px}

.chat{display:flex;flex-direction:column;gap:9px;padding:8px 0 6px}
.botrow{display:flex;gap:9px;align-items:flex-start;align-self:flex-start;max-width:92%}
.botava{
  width:38px;height:38px;flex:none;border-radius:50%;background:var(--yellow);
  border:2px solid var(--ink);object-fit:contain;padding:4px;box-shadow:2px 2px 0 var(--ink);
}
.botname{font-size:11.5px;font-weight:750;color:var(--tx3);margin:0 0 4px 4px}
.botrow .msg.bot{max-width:100%}
.quick,.reccard{margin-left:47px}
.msg{max-width:80%;padding:11px 15px;border:2px solid var(--ink);border-radius:18px;font-size:14.5px;line-height:1.5;font-weight:550}
.msg.bot{background:var(--cream);color:var(--ink);align-self:flex-start;border-bottom-left-radius:6px;box-shadow:2px 2px 0 var(--ink)}
.msg.me{background:var(--yellow);color:var(--ink);align-self:flex-end;border-bottom-right-radius:6px;box-shadow:2px 2px 0 var(--ink)}
.quick{display:flex;gap:7px;flex-wrap:wrap;align-self:flex-start;margin:2px 0 4px}
.quick button{

/* 좌표·도보시간 계산 */
STORES.forEach(function(s){
  var c=DONGS[s.dong];
  var dx=(s.lng-c.lng)*88000, dy=(s.lat-c.lat)*111000;
  s.dist=Math.round(Math.sqrt(dx*dx+dy*dy)/10)*10;
  s.walk=Math.max(1,Math.round(s.dist/70));
});

function byId(id){ return STORES.find(function(s){return s.id===id}); }
function inDong(){ return STORES.filter(function(s){return s.dong===S.dong}); }
function isOpen(s){
  var h=hourNow();
  if(s.closed && s.closed.indexOf(new Date().getDay())>=0) return false;
  if(s.hours[0]===0&&s.hours[1]===24) return true;
  return h>=s.hours[0] && h<s.hours[1];
}
function hhmm(v){ var h=Math.floor(v),m=Math.round((v-h)*60); return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'); }
function under10k(s){ return s.menus.some(function(m){return m[1]<=10000}); }
function repCount(s){ return S.reports[s.id]||0; }
function verified(s){ return repCount(s)>=2 ? 'pending' : 'ok'; }
function nutScore(s){
  var sc=s.nut;
  var cnt=S.mealLog.filter(function(g){return g===s.grp}).length;
  sc -= cnt*2;                          // 최근 많이 먹은 그룹은 감점 (다양성 가점)
  sc -= s.dist/400;                     // 거리 보정
  if(verified(s)==='pending') sc -= 6;  // 신고 누적 → 노출 강등
  return sc;
}

/* 필터 상태 */
var FILT={open:true, solo:false, togo:false, cheap:true, near:false};

/* mode: 'all' | 'food' | 'cvs' */
function filteredStores(mode){
  mode=mode||S.cat;
  var list=inDong().filter(function(s){
    if(mode==='food' && s.cvs) return false;
    if(mode==='cvs' && !s.cvs) return false;
    if(mode==='kr'||mode==='cn'||mode==='wf'||mode==='bs'){ if(s.cat2!==mode) return false; }
    if(FILT.open && !isOpen(s)) return false;
    if(FILT.solo && !s.solo) return false;
    if(FILT.togo && !s.togo) return false;
    if(FILT.cheap && !under10k(s)) return false;
    return true;
  });
  list.sort(function(a,b){ return FILT.near ? a.dist-b.dist : nutScore(b)-nutScore(a); });
  return list;
}
function cvsOpenList(){
  return inDong().filter(function(s){return s.cvs&&isOpen(s)}).sort(function(a,b){return a.dist-b.dist});
}

var B_24='<span class="pill ok"><span class="d"></span>24시간</span>';

function badges(s,compact){
  var b=s.cvs?B_24:(isOpen(s)?B_OPEN:B_CLOSED);
  if(!compact){ if(s.solo)b+=B_SOLO; if(s.togo)b+=B_TOGO; }
  b+= verified(s)==='ok'?B_PAY:B_PEND;
  return b;
}
function countUp(el,target,ms){
  if(!el) return;
  var start=null;
  function tick(t){
    if(start===null) start=t;
    var p=Math.min(1,Math.max(0,(t-start)/(ms||600)));
    p=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.round(target*p));
    if(p<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  setTimeout(function(){ el.textContent=fmt(target); },(ms||600)+120);
}

var KAKAO={state:'idle'};   // idle | loading | ready | failed
function loadKakao(cb){
  if(KAKAO.state==='ready'){ cb(true); return; }
  if(!KAKAO_KEY){ KAKAO.state='failed'; cb(false); return; }
  if(KAKAO.state==='loading'){ (KAKAO.q=KAKAO.q||[]).push(cb); return; }
  KAKAO.state='loading'; KAKAO.q=[cb];
  var sc=document.createElement('script');
  sc.async=true;
  sc.src='https://dapi.kakao.com/v2/maps/sdk.js?appkey='+encodeURIComponent(KAKAO_KEY)+'&autoload=false&libraries=services';
  sc.onload=function(){
    try{
      window.kakao.maps.load(function(){
        KAKAO.state='ready';
        KAKAO.q.forEach(function(f){f(true)}); KAKAO.q=[];
      });
    }catch(e){ fail(); }
  };
  sc.onerror=fail;
  function fail(){ KAKAO.state='failed'; (KAKAO.q||[]).forEach(function(f){f(false)}); KAKAO.q=[]; }
  document.head.appendChild(sc);
}

/* 내장 약도(폴백) — 실제 좌표를 화면에 투영 */
function fallbackSvg(list){
  var c=DONGS[S.dong], W=340, H=260, PAD=42;
  var maxd=Math.max(300, list.reduce(function(m,s){return Math.max(m,s.dist)},0));
  var k=(Math.min(W,H)/2-PAD)/maxd;
  function px(s){
    var dx=(s.lng-c.lng)*88000, dy=(s.lat-c.lat)*111000;
    return {x:W/2+dx*k, y:H/2-dy*k};
  }
  var groups=clusterize(list.slice(0,12));
  var no=0;
  var pins=groups.map(function(g){
    var p=px(g);
    if(g.items.length===1){
      var s=g.items[0]; no++;
      var fillc=CAT_COLOR[s.cat2]||'#FFFFFF';
      return '<g data-store="'+s.id+'" style="cursor:pointer'+(verified(s)==='pending'?';opacity:.55':'')+'" transform="translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')">'
       +'<circle r="15" fill="'+fillc+'" stroke="#17151C" stroke-width="2.4"/>'
       +'<circle r="18" fill="none" stroke="rgba(23,21,28,.18)" stroke-width="1"/>'
       +'<text y="5" text-anchor="middle" font-size="14" font-family="Tossface,sans-serif">'+catEmoji(s)+'</text></g>';
    }
    var ids=g.items.map(function(s){return s.id}).join(','); no+=g.items.length;
    return '<g data-cluster="'+ids+'" style="cursor:pointer" transform="translate('+p.x.toFixed(1)+','+p.y.toFixed(1)+')">'
     +'<circle r="15.5" fill="#191F28" stroke="#fff" stroke-width="2.6"/>'
     +'<text y="4.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#fff" font-family="Pretendard,sans-serif">'+g.items.length+'</text></g>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice" role="img" aria-label="'+S.dong+' 주변 가맹점 약도">'
   +'<rect width="'+W+'" height="'+H+'" fill="#EFEAF6"/>'
   +'<path d="M-10 176 H350" stroke="#fff" stroke-width="20"/>'
   +'<path d="M-10 76 H350" stroke="#fff" stroke-width="13"/>'
   +'<path d="M108 -10 V270" stroke="#fff" stroke-width="17"/>'
   +'<path d="M246 -10 V270" stroke="#fff" stroke-width="11"/>'
   +'<rect x="20" y="94" width="76" height="44" rx="5" fill="#fff" opacity=".65"/>'
   +'<rect x="262" y="188" width="64" height="42" rx="5" fill="#fff" opacity=".65"/>'
   +'<rect x="258" y="34" width="58" height="30" rx="5" fill="#fff" opacity=".65"/>'
   +'<circle cx="170" cy="130" r="20" fill="#E8613C" opacity=".13"/>'
   +'<circle cx="170" cy="130" r="6" fill="#E8613C" stroke="#fff" stroke-width="2.6"/>'
   +'<text x="170" y="152" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6B7684" font-family="Pretendard,sans-serif">내 위치</text>'
   +pins+'</svg>';
}

function mapHtml(round){
  return '<div class="mapwrap'+(round?' round':'')+(S.mapBig?' big':'')+'" id="mapwrap">'
   +'<div class="mapbox" id="mapbox"></div>'
   +'<div class="maptip" id="maptip">'+S.dong+'</div>'

   +'<button id="mapbig" aria-label="지도 크게 보기">'+svg(S.mapBig?IC.shrink:IC.expand)+'</button>'
   +'<button id="maphome" aria-label="내 위치로">'+svg(IC.target)+'</button>'
   +'</div></div>';
}
function applySearch(){
  var rows=document.querySelectorAll('#view .store[data-store]');
  var n=0;
  rows.forEach(function(r){
    var s=byId(r.getAttribute('data-store'));
    var hit=s && nameMatch(s,S.q);
    r.classList.toggle('hiddenq',!hit);
    if(hit) n++;
  });
  var cntEl=document.getElementById('qcount');
  if(cntEl) cntEl.textContent=n;
  var none=document.getElementById('qnone');
  if(none) none.style.display=(S.q&&n===0)?'block':'none';
}
function clusterize(list,meters){
  meters=meters||120;
  var groups=[];
  list.forEach(function(s){
    var g=groups.find(function(gr){
      var dx=(s.lng-gr.lng)*88000, dy=(s.lat-gr.lat)*111000;
      return Math.sqrt(dx*dx+dy*dy)<meters;
    });
    if(g){ g.items.push(s); g.lat=(g.lat*(g.items.length-1)+s.lat)/g.items.length; g.lng=(g.lng*(g.items.length-1)+s.lng)/g.items.length; }
    else groups.push({lat:s.lat,lng:s.lng,items:[s]});
  });
  return groups;
}
function clusterSheet(ids){
  var arr=ids.split(',').map(byId).filter(Boolean);
  openSheet('<h3>이 자리에 '+arr.length+'곳이 있어요</h3>'
   +'<p class="desc">가까이 붙어 있어서 묶어서 보여드려요. 골라서 자세히 보세요.</p>'
   +arr.map(function(s,i){return storeRow(s,i)}).join(''));
}
function mountMap(list){
  var box=document.getElementById('mapbox'); if(!box) return;
  box.innerHTML=fallbackSvg(list);                     // 먼저 폴백을 그려 빈 화면 방지
  loadKakao(function(ok){
    var b=document.getElementById('mapbox'); if(!b) return;
    if(!ok){ return; }   /* 키 없으면 조용히 내장 약도 */
    b.innerHTML='';
    var c=DONGS[S.dong];
    var map=new kakao.maps.Map(b,{center:new kakao.maps.LatLng(c.lat,c.lng),level:4});
    map.setMaxLevel(7);
    KAKAO.map=map;
    new kakao.maps.CustomOverlay({
      map:map, position:new kakao.maps.LatLng(c.lat,c.lng), zIndex:1,
      content:'<div class="kme" title="내 위치"></div>'
    });
    var bounds=new kakao.maps.LatLngBounds();
    bounds.extend(new kakao.maps.LatLng(c.lat,c.lng));
    var groups=clusterize(list.slice(0,14));
    var no=0;
    groups.forEach(function(g){
      var pos=new kakao.maps.LatLng(g.lat,g.lng);
      bounds.extend(pos);
      if(g.items.length===1){
        var s=g.items[0]; no++;
        new kakao.maps.CustomOverlay({
          map:map, position:pos, yAnchor:1, zIndex:3, clickable:true,
          content:'<div class="kpin cat-'+s.cat2+(verified(s)==='pending'?' dim':'')+'" data-store="'+s.id+'">'
                  +'<div class="b"><span class="tossface">'+catEmoji(s)+'</span> '+esc(s.name)+'</div><div class="tail"></div></div>'
        });
      }else{
        var ids=g.items.map(function(s){return s.id}).join(',');
        no+=g.items.length;
        new kakao.maps.CustomOverlay({
          map:map, position:pos, zIndex:4, clickable:true,
          content:'<div class="kclu" data-cluster="'+ids+'" title="가게 '+g.items.length+'곳 묶음">'+g.items.length+'</div>'
        });
      }
    });
    if(list.length) map.setBounds(bounds,40,40,40,40);
    KAKAO._home=function(){ map.setCenter(new kakao.maps.LatLng(c.lat,c.lng)); map.setLevel(4); };
  });
}

/* 카테고리 세그먼트 (피드백 ②) */
function segHtml(){
  var all=inDong();
  function cnt(f){ return all.filter(function(s){return f(s)&&isOpen(s)}).length; }
  var t=[
    ['all','전체',cnt(function(s){return true})],
    ['kr','한식',cnt(function(s){return s.cat2==='kr'})],
    ['cn','중식',cnt(function(s){return s.cat2==='cn'})],
    ['wf','양식',cnt(function(s){return s.cat2==='wf'})],
    ['bs','분식',cnt(function(s){return s.cat2==='bs'})],
    ['cvs','편의점',cnt(function(s){return s.cat2==='cvs'})]
  ];
  return '<div class="catbar" role="tablist" aria-label="음식 카테고리">'+t.map(function(i){
    return '<button role="tab" aria-selected="'+(i[0]===S.cat)+'" class="catchip '+(i[0]===S.cat?'on':'')+'" data-cat="'+i[0]+'">'+i[1]+'<span class="cnt">'+i[2]+'</span></button>';
  }).join('')+'</div>';
}

function renderChat(){
  V.innerHTML='<div class="chat">'+S.chatHist.join('')+'</div>';
  V.scrollTop=V.scrollHeight;
}
function botSay(t){
  S.chatHist.push('<div class="botrow fade"><img class="botava" alt="" src="'+APP_LOGO+'">'
   +'<div><p class="botname">한끼</p><div class="msg bot">'+t+'</div></div></div>');
}
function meSay(t){ S.chatHist.push('<div class="msg me fade">'+esc(t)+'</div>'); }
function quick(opts){
  S.chatHist.push('<div class="quick fade">'+opts.map(function(o){
    return '<button data-qr="'+o[1]+'" data-label="'+esc(o[0])+'">'+o[0]+'</button>';
  }).join('')+'</div>');
}
function stripQuick(){
  S.chatHist=S.chatHist.filter(function(x){return x.indexOf('class="quick')<0});
}
function chatFlow(action,label){
  stripQuick(); if(label) meSay(label);
  if(action==='food'){ botSay('혼자 드세요?'); quick([['혼자 먹어요','solo1'],['같이 먹어요','solo0']]); }
  else if(action==='solo1'||action==='solo0'){
    S.chatCtx.solo=(action==='solo1');
    botSay('가게에서 드실래요, 포장하실래요?');
    quick([['가게에서요','eat'],['포장할래요','togo'],['아무거나요','any']]);
  }
  else if(action==='eat'||action==='togo'||action==='any'){
    FILT.open=true; FILT.cheap=true;
    FILT.solo=!!S.chatCtx.solo; FILT.togo=(action==='togo');
    S.cat='food';
    var list=filteredStores('food');
    if(list.length===0){
      botSay('지금 조건에 맞는 식당이 없어요. 대신 근처 편의점에서 <b>균형 있게 조합하는 법</b>을 알려드릴게요.');
      quick([['편의점 조합 보기','cvs'],['조건 바꿔서 다시','food']]);
    }else{
      var top=list[0], m=top.menus.filter(function(x){return x[1]<=10000}).slice(-1)[0]||top.menus[0];
      botSay('지금 열려 있'+(FILT.solo?'고, 혼자 가도 편하':'')+'고, 1만 원 안에 되는 곳 <b>'+list.length+'곳</b>을 찾았어요. 이번 주에 국·찌개를 많이 드셨으니 이걸 추천해요.');
      S.chatHist.push('<div class="reccard fade" data-store="'+top.id+'">'
       +'<div style="display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap">'+badges(top)+'</div>'
       +'<p style="font-size:15.5px;font-weight:700;margin:0 0 2px">'+top.name+' · '+m[0]+'</p>'
       +'<p class="sub" style="font-size:13px;margin-bottom:10px">'+fmt(m[1])+'원 · '+top.dist+'m · 도보 '+top.walk+'분</p>'
       +'<button class="btn sm">자세히 보기</button></div>');
      quick([['다른 곳도 볼래요','map'],['편의점 조합','cvs'],['잔액 알려줘요','bal']]);
    }
  }
  else if(action==='bal'){
    var exp=expireAmt();
    botSay('지금 <b>'+fmt(S.balance)+'원</b> 남았어요 ('+S.lastInput+' 입력 기준). '
      +(exp>0?'이대로면 <b>'+fmt(exp)+'원</b>이 월말에 사라져요 — 하루 <b>'+fmt(dailyRec())+'원</b>씩 쓰면 딱 맞아요.':'하루 <b>'+fmt(dailyRec())+'원</b>씩 쓰면 사라지는 돈 없이 다 쓸 수 있어요.'));
    quick([['잔액 다시 입력할게요','goBal'],['오늘 뭐 먹지?','food']]);
  }
  else if(action==='wel'){
    botSay('네 조건('+S.profile.join(' · ')+')으로 찾아보면 받을 수 있는 제도가 <b>3개</b> 있어요. 목록으로 보여드릴게요.');
    quick([['혜택 목록 보기','goWel'],['오늘 뭐 먹지?','food']]);
  }
  else if(action==='cvs'){ renderChat(); go('cvs'); return; }
  else if(action==='map'){ renderChat(); go('result'); return; }
  else if(action==='goBal'){ renderChat(); go('balance'); return; }
  else if(action==='goWel'){ renderChat(); go('welfare'); return; }
  else if(action==='expInfo'){ renderChat(); expirySheet(); return; }
  renderChat();
}
function chatFree(text){
  stripQuick(); meSay(text);
  var t=text.toLowerCase();
  if(/편의점|도시락|삼각김밥|컵라면/.test(t)) { renderChat(); go('cvs'); return; }
  if(/이월|소멸|넘어가|사라지|규정/.test(t)){
    botSay('좋은 질문이에요! <b>지역마다 달라요.</b> 경기도는 월말 잔액이 다음 달로 이월되고 12월 말에 소멸돼요. 춘천시는 공식 안내에 이월 여부가 없어서, 보육아동과(033-250-3686) 확인 전까지는 <b>매월 다 쓰는 기준</b>으로 계산하고 있어요.');
    quick([['규정 자세히 보기','expInfo'],['잔액 알려줘요','bal']]);
    renderChat(); return;
  }
  if(/잔액|얼마|남았|충전|한도/.test(t)) return chatFlow('bal','');
  if(/먹|배고|메뉴|추천|밥|점심|저녁|식당/.test(t)) return chatFlow('food','');
  if(/혜택|복지|지원|제도|급여/.test(t)) return chatFlow('wel','');
  if(/동네|지역|위치|옮/.test(t)){ botSay('어느 동네로 바꿀까요?'); quick(DONG_LIST.map(function(d){return [d,'dong:'+d]})); renderChat(); return; }
  botSay('제가 도울 수 있는 건 이런 것들이에요 — 골라주세요!');
  quick([['오늘 뭐 먹지?','food'],['편의점 조합','cvs'],['잔액 알려줘요','bal'],['받을 수 있는 혜택','wel']]);
  renderChat();
}

   +'<button class="mrow" id="askhelp">가게에서 카드가 안 됐어요<span class="ch">'+svg(IC.chev)+'</span></button>'
   +'</div>';
  countUp(document.getElementById('meAmt'), S.balance, 600);
};

/* 잔액 입력 */
SCR.balance=function(){
  N.innerHTML=navBar('잔액 입력','home');
  F.innerHTML='<div class="footbar"><button class="btn" id="balsave">저장하고 홈으로</button></div>';
  var v=S.balInput==null?S.balance:+(S.balInput||0);
  var dl=daysLeft(), rec=Math.ceil(v/dl/100)*100, exp=Math.max(0,v-dl*S.limit);
  V.innerHTML='<div class="fade">'
   +'<div class="bigin"><p class="v"><span class="cur">₩</span><span id="balAmt">'+fmt(v)+'</span></p>'
   +'<p class="cap">카드 앱이나 문자에서 확인한 금액을 넣어주세요</p></div>'
   +quickAmtHtml()
   +padHtml()
   +'<div class="card"><p class="lbl">이렇게 쓰면 딱 맞아요</p><div class="calc">'
   +'<div class="r"><span>남은 사용 가능일</span><b>'+dl+'일</b></div>'
   +'<div class="r"><span>하루 권장 사용액</span><b id="cRec">'+fmt(rec)+'원</b></div>'
   +'<div class="r"><span>1일 결제 한도</span><b>'+fmt(S.limit)+'원</b></div>'
   +'<div class="r hl"><span>이대로면 사라지는 금액</span><b id="cExp">'+fmt(exp)+'원</b></div>'
   +'</div></div>'
   +'<div class="alert warn">'+svg(IC.warn,2)+'<span>남은 금액은 <b>'+expLabel()+'</b>에 사라져요. 사라지기 <b>7일 전</b>과 <b>하루 전</b>에 미리 알려드릴게요.</span></div>'
   +'<button class="btn ghost sm" id="expinfo" style="margin-top:10px">이월·소멸 규정 확인하기</button>'
   +'</div>';
};

/* ───────── 시트: 동네 / 신고 / 방문 기록 / 지도키 / 시연 시간 ───────── */
var PF_FAM=['한부모가정','조손가정','다문화가정','기초생활수급'];
var PF_SCH=['초등학생','중학생','고등학생'];
function profileSheet(){
  var fam=S.profile[0], sch=S.profile[3]||'초등학생';
  openSheet('<h3>내 조건 수정</h3>'
   +'<p class="desc">혜택 찾기에만 쓰고, 다른 곳에는 쓰지 않아요.</p>'
   +'<p class="lbl">가구 상황</p>'
   +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">'
   +PF_FAM.map(function(x){return '<button class="chip'+(x===fam?' on':'')+'" data-pfam="'+x+'">'+x+'</button>'}).join('')+'</div>'
   +'<p class="lbl">학교</p>'
   +'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">'
   +PF_SCH.map(function(x){return '<button class="chip'+(x===sch?' on':'')+'" data-psch="'+x+'">'+x+'</button>'}).join('')+'</div>'
   +'<button class="btn" id="pfsave">저장하기</button>');
}
function expirySheet(){
  openSheet('<h3>잔액, 다음 달로 넘어가나요?</h3>'
   +'<p class="desc"><b>지역마다 달라요.</b> 예를 들어 경기도(씨앗밥상)는 월말 잔액이 <b>다음 달로 이월</b>되고 12월 말에만 소멸돼요. 반면 매월 말 소멸되는 지역도 있어요.<br><br>'
   +'춘천시 공식 안내에는 이월 여부가 명시돼 있지 않아요. 정확한 규정은 <b>춘천시청 보육아동과(033-250-3686)</b>에 확인해요 — 확인 전까지는 안전하게 <b>매월 다 쓰는 것</b>을 기준으로 계산할게요.</p>'
   +'<p class="lbl">계산 기준 (확인 후 바꿔요)</p>'
   +'<button class="choice'+(S.expMode==='month'?' on':'')+'" data-exp="month">매월 말 소멸 기준 <span style="margin-left:auto;font-size:12.5px;color:var(--g500)">보수적 · 권장</span></button>'
   +'<button class="choice'+(S.expMode==='year'?' on':'')+'" data-exp="year">월 이월 · 12월 말 소멸 기준</button>'
   +'<div style="display:flex;gap:8px;margin-top:14px">'
   +'<a class="btn ghost sm" style="flex:1;text-decoration:none" href="tel:033-250-3686">보육아동과 전화</a>'
   +'<a class="btn ghost sm" style="flex:1;text-decoration:none" href="https://www.chuncheon.go.kr/new-welfare/life/child/absenteeism/" target="_blank" rel="noopener">공식 안내 보기</a>'
   +'</div>');
}
function dongSheet(){
  openSheet('<h3>어느 동네에서 볼까요?</h3>'
   +'<p class="desc">선택한 동네를 중심으로 지도와 가맹점 목록이 바뀌어요.</p>'
   +DONG_LIST.map(function(d){
      var n=STORES.filter(function(s){return s.dong===d}).length;
      return '<button class="choice dongc'+(S.dong===d?' on':'')+'" style="background:'+DONG_COLOR[d]+'" data-setdong="'+d+'">'+svg(IC.pin)+d
       +'<span style="margin-left:auto;font-size:13px;font-weight:600;color:var(--g400)">'+n+'곳</span></button>';
    }).join(''));
}
function keySheet(){
  openSheet('<h3>카카오맵 연결하기</h3>'
   +'<p class="desc">카카오 개발자센터에서 발급받은 <b>JavaScript 키</b>를 넣으면 실제 지도로 바뀌어요. '
   +'키가 없으면 내장 약도로 계속 쓸 수 있어요.<br><span style="font-size:13px;color:var(--g500)">developers.kakao.com → 내 애플리케이션 → 앱 키 → JavaScript 키. '
   +'플랫폼 &gt; Web 에 이 페이지 도메인을 등록해야 지도가 뜹니다.</span></p>'
   +'<input type="text" id="keyinp" placeholder="JavaScript 키 붙여넣기" value="'+esc(KAKAO_KEY)+'" autocomplete="off" spellcheck="false">'
   +'<button class="btn" id="keysave">연결하기</button>'
   +'<button class="skiplink" id="closeonly">나중에 할게요</button>');
}
function reportSheet(sid){
  var s=byId(sid);
  var alt=filteredStores('food').filter(function(x){return x.id!==sid})[0];
  openSheet('<h3>알려주셔서 고마워요</h3>'
   +'<p class="desc"><b>'+s.name+'</b>에서 결제가 안 됐군요. 확인이 끝날 때까지 이 가게는 추천에서 뒤로 미뤄둘게요. 잘못한 게 아니에요.</p>'
   +(alt?'<p class="lbl">대신 여기는 어때요?</p>'+storeRow(alt,0):'')
   +'<button class="btn" id="repok">확인</button>');
  S._repTarget=sid;
}
function visitSheet(sid){
  var s=byId(sid);
  openSheet('<h3>다녀오셨어요? 뭐 드셨어요?</h3>'
   +'<p class="desc">한 번만 눌러주면 다음 추천이 더 정확해져요.</p>'
   +'<button class="choice" data-meal="'+s.grp+'">추천받은 메뉴 먹었어요</button>'
   +'<button class="choice" data-meal="기타">다른 걸 먹었어요</button>'
   +'<button class="skiplink" id="novisit">안 갔어요 / 건너뛰기</button>');
}
function demoSheet(){
  var opts=[[8,'아침 (08:00)'],[11.5,'점심 (11:30)'],[15,'오후 (15:00)'],[19,'저녁 (19:00)'],[23.5,'밤 (23:30)'],[null,'실제 시간으로']];
  openSheet('<h3>시연용 시간 바꾸기</h3>'
   +'<p class="desc">시간에 따라 "지금 열린 곳" 필터와 빈 상태 → 편의점 모드가 어떻게 달라지는지 볼 수 있어요. (심사 시연용 장치)</p>'
   +opts.map(function(o){
      var on=(S.demoHour===o[0]);
      return '<button class="choice'+(on?' on':'')+'" data-hour="'+o[0]+'">'+o[1]+'</button>';
    }).join(''));
}
function fabLabel(){
  FAB.innerHTML='<span class="d"></span>'+(S.demoHour==null?'시연 모드':'시연 · '+hhmm(S.demoHour));
}

/* ───────── 라우터 ───────── */
function go(id){
  if(!SCR[id]) return;
  V.className=''; V.setAttribute('data-screen',id); S.screen=id;
  SCR[id]();
  if(id!=='chat') V.scrollTop=0;
  FAB.style.display = (id==='home') ? 'flex' : 'none';
  fabLabel();
}

/* ───────── 이벤트 위임 ───────── */
document.addEventListener('click',function(e){
  var t;
  /* 온보딩 */
  if(t=e.target.closest('[data-dong]')){ S.obDong=t.dataset.dong; S.dong=t.dataset.dong; SCR.ob1(); return; }
  if(e.target.closest('#obNext')){ S.balInput=''; go('ob2'); return; }
  if(e.target.closest('#obSkip')){ S.balInput=null; go('ob3'); return; }
  if(e.target.closest('#obSave')){
    var v=+(S.balInput||0);
    if(v>0){ S.balance=v; S.lastInput='오늘'; }
    S.balInput=null; go('ob3'); return;
  }
  if(e.target.closest('#obDone')){ S.onboarded=true; go('home'); return; }

  /* 검색 지우기 */
  if(e.target.closest('#qclear')){
    S.q='';
    var inp=document.getElementById('storeq');
    if(inp){ inp.value=''; inp.focus(); }
    var c=document.getElementById('qclear'); if(c) c.remove();
    applySearch();
    return;
  }

  /* 프로필 수정 */
  if(e.target.closest('#pfedit')){ profileSheet(); return; }
  if(t=e.target.closest('[data-pfam]')){
    S.profile[0]=t.dataset.pfam;
    document.querySelectorAll('[data-pfam]').forEach(function(b){b.classList.toggle('on',b.dataset.pfam===S.profile[0])});
    return;
  }
  if(t=e.target.closest('[data-psch]')){
    S.profile[3]=t.dataset.psch;
    document.querySelectorAll('[data-psch]').forEach(function(b){b.classList.toggle('on',b.dataset.psch===S.profile[3])});
    return;
  }
  if(e.target.closest('#pfsave')){
    closeSheet(); toast('저장했어요 — 조건에 맞는 혜택으로 다시 찾았어요');
    if(S.screen==='welfare'||S.screen==='me') SCR[S.screen]();
    return;
  }

  /* 이월·소멸 규정 */
  if(e.target.closest('#expinfo')){ expirySheet(); return; }
  if(t=e.target.closest('[data-exp]')){
    S.expMode=t.dataset.exp; closeSheet();
    toast(S.expMode==='month'?'매월 말 소멸 기준으로 계산해요':'월 이월 · 12월 말 소멸 기준으로 계산해요');
    if(SCR[S.screen]) SCR[S.screen]();
    return;
  }
  /* 지도 클러스터 */
  if(t=e.target.closest('[data-cluster]')){ clusterSheet(t.getAttribute('data-cluster')); return; }

  /* 동네 변경 */
  if(e.target.closest('#dongbtn')){ dongSheet(); return; }
  if(t=e.target.closest('[data-setdong]')){
    S.dong=t.dataset.setdong; S.q=''; closeSheet();
    toast(S.dong+' 기준으로 바꿨어요');
    S.chatHist=[];
    if(S.screen==='detail') go('result'); else go(S.screen);
    return;
  }

  /* 지도 컨트롤 */
  if(e.target.closest('#mapbig')){
    S.mapBig=!S.mapBig;
    var w=document.getElementById('mapwrap');
    if(w){ w.classList.toggle('big',S.mapBig);
      var b=document.getElementById('mapbig'); if(b) b.innerHTML=svg(S.mapBig?IC.shrink:IC.expand);
      if(KAKAO.map&&window.kakao) setTimeout(function(){kakao.maps.event.trigger(KAKAO.map,'resize')},260);
    }
    return;
  }
  if(e.target.closest('#maphome')){ if(KAKAO._home) KAKAO._home(); else toast('내 위치는 '+S.dong+' 중심이에요'); return; }
  if(e.target.closest('[data-keysheet]')){ keySheet(); return; }
  if(e.target.closest('#keysave')){
    var inp=document.getElementById('keyinp');
    var k=inp?inp.value.trim():'';
    if(!k){ toast('키를 붙여넣어 주세요'); return; }
    KAKAO_KEY=k; KAKAO.state='idle'; closeSheet();
    toast('연결 중이에요…');
    go(S.screen==='me'?'result':S.screen);
    return;
  }

  /* 카테고리 세그먼트 */
  if(t=e.target.closest('[data-cat]')){
    S.cat=t.dataset.cat;
    if(S.cat==='cvs' && S.screen!=='result'){ go('result'); return; }
    go('result'); return;
  }

  /* 키패드 */
  if(t=e.target.closest('[data-amt]')){
    var a=t.dataset.amt;
    var base=+(S.balInput==null?(S.screen==='balance'?S.balance:0):(S.balInput||0));
    var n2 = a==='clear' ? 0 : Math.min(9999999, base + +a);
    S.balInput=String(n2);
    syncAmt(n2); return;
  }
  if(t=e.target.closest('[data-key]')){
    var k=t.dataset.key;
    var cur=S.balInput==null?String(S.screen==='balance'?S.balance:0):S.balInput;
    if(S.balInput==null&&S.screen==='balance') cur=''; // 첫 입력 시 초기화
    if(k==='del') cur=cur.slice(0,-1);
    else if(cur.replace(/^0+/,'').length<7) cur=(cur==='0'?'':cur)+k;
    S.balInput=cur;
    syncAmt(+(cur||0));
    return;
  }
  if(e.target.closest('#balsave')){
    var n=+(S.balInput==null?S.balance:S.balInput||0);
    S.balance=n; S.lastInput='오늘'; S.balInput=null;
    toast('저장했어요 — 하루 '+fmt(dailyRec())+'원이 기준이에요');
    go('home'); return;
  }

  /* 필터 칩 */
  if(t=e.target.closest('[data-chip]')){ FILT[t.dataset.chip]=!FILT[t.dataset.chip]; go('result'); return; }

  /* 가게 카드 → 상세 */
  if(t=e.target.closest('[data-store]')){
    S.curStore=t.dataset.store;
    S.backTo = (S.screen==='cvs'?'cvs':(S.screen==='me'?'me':(S.screen==='home'?'home':'result')));
    if(S.screen==='chat'){ S.backTo='chat'; renderChat(); }
    go('detail'); return;
  }

  /* 상세: 단골 / 길찾기 / 신고 */
  if(e.target.closest('#favbtn')){
    var id=S.curStore;
    if(S.favorites[id]){ delete S.favorites[id]; toast('단골에서 뺐어요'); }
    else { S.favorites[id]=true; toast('단골로 저장했어요 — 홈에서 바로 보여요'); }
    SCR.detail(); return;
  }
  if(e.target.closest('#kakaoview')){
    var sv=byId(S.curStore);
    window.open('https://map.kakao.com/link/map/'+encodeURIComponent(sv.name)+','+sv.lat+','+sv.lng,'_blank','noopener');
    toast('카카오맵에서 '+sv.name+'을(를) 열었어요');
    return;
  }
  if(e.target.closest('#navigate')){
    var s=byId(S.curStore);
    /* 카카오맵 길찾기로 넘기기 (앱/웹 자동) */
    var url='https://map.kakao.com/link/to/'+encodeURIComponent(s.name)+','+s.lat+','+s.lng;
    window.open(url,'_blank','noopener');
    toast('카카오맵으로 길안내를 열었어요');
    setTimeout(function(){ visitSheet(S.curStore); },1200);
    return;
  }
  if(e.target.closest('#reportbtn')){ reportSheet(S.curStore); return; }
  if(e.target.closest('#repok')){
    var rid=S._repTarget;
    S.reports[rid]=(S.reports[rid]||0)+2;   // 시연: 1탭으로 강등까지 보여줌
    closeSheet(); SCR.detail();
    toast('접수했어요 — 확인 중 배지로 바뀌고 추천에서 뒤로 밀려요');
    return;
  }
  if(t=e.target.closest('[data-meal]')){
    S.mealLog.push(t.dataset.meal); S.mealLog=S.mealLog.slice(-7);
    closeSheet(); toast('기록했어요 — 다음 추천에 반영할게요'); return;
  }
  if(e.target.closest('#novisit')){ closeSheet(); return; }

  /* 챗봇 */
  if(t=e.target.closest('[data-qr]')){
    var qr=t.dataset.qr;
    if(qr.indexOf('dong:')===0){
      S.dong=qr.slice(5); stripQuick();
      botSay('<b>'+S.dong+'</b> 기준으로 바꿨어요. 이제 그 동네 가게를 보여드릴게요.');
      quick([['오늘 뭐 먹지?','food'],['편의점 조합','cvs']]);
      renderChat(); return;
    }
    chatFlow(qr, t.dataset.label); return;
  }
  if(e.target.closest('#chatsend')){
    var ci=document.getElementById('chatinp');
    if(ci&&ci.value.trim()){ chatFree(ci.value.trim()); ci.value=''; }
    return;
  }

  /* 내정보 */
  if(t=e.target.closest('[data-sw]')){
    var sk=t.dataset.sw; S.notif[sk]=!S.notif[sk]; SCR.me();
    toast(S.notif[sk]?'알림을 켰어요':'알림을 껐어요'); return;
  }
  if(e.target.closest('#askhelp')){
    openSheet('<h3>카드가 안 됐나요?</h3><p class="desc">가게 상세 화면 맨 아래 <b style="color:var(--red)">"여기서 급식카드가 안 됐어요"</b> 버튼을 누르면 돼요. 접수되면 그 가게는 확인이 끝날 때까지 추천에서 뒤로 미뤄져요.</p><button class="btn" id="closeonly">알겠어요</button>');
    return;
  }
  if(e.target.closest('#closeonly')){ closeSheet(); return; }

  /* 시연 시간 */
  if(e.target.closest('#demofab')){ demoSheet(); return; }
  if(t=e.target.closest('[data-hour]')){
    S.demoHour = t.dataset.hour==='null' ? null : +t.dataset.hour;
    closeSheet(); fabLabel();
    if(S.screen==='chat'){ S.chatHist=[]; }
    go(S.screen);
    return;
  }

  /* 일반 이동 */
  if(t=e.target.closest('[data-go]')){ go(t.dataset.go); return; }
});
function syncAmt(n){
  var el=document.getElementById('balAmt')||document.getElementById('obAmt');
  if(el) el.textContent=fmt(n);
  var dl=daysLeft();
  var r=document.getElementById('cRec'), x=document.getElementById('cExp');
  if(r) r.textContent=fmt(Math.ceil(n/dl/100)*100)+'원';
  if(x) x.textContent=fmt(Math.max(0,n-dl*S.limit))+'원';
}
document.addEventListener('input',function(e){
  if(e.target.id==='storeq'){
    S.q=e.target.value;
    applySearch();
    var sb=e.target.parentElement;
    var clr=sb.querySelector('.clear');
    if(S.q && !clr){
      var b=document.createElement('button');
      b.className='clear'; b.id='qclear'; b.textContent='×'; b.setAttribute('aria-label','지우기');
      sb.appendChild(b);
    }else if(!S.q && clr){ clr.remove(); }
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='chatinp'&&e.target.value.trim()){
    chatFree(e.target.value.trim()); e.target.value='';
  }
  if(e.key==='Escape') closeSheet();
});

go('ob1');
})();
</script>
